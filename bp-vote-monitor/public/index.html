<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BP Vote Monitor</title>
<style>
  :root {
    --bg: #070b14; --panel: #0d1424; --panel2: #111a2e; --line: #1d2a44;
    --text: #e2e8f0; --muted: #7c8aa5; --green: #22c55e; --red: #ef4444;
    --amber: #f59e0b; --orange: #f97316; --gray: #64748b; --blue: #38bdf8; --accent: #1d4ed8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(7,11,20,.94); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  .spacer { flex: 1; }
  .conn { font-size: 12px; color: var(--muted); }
  .conn.err { color: var(--red); }
  input, select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
                          border-radius: 8px; padding: 7px 10px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--blue); }

  .teams { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .team { font-weight: 600; padding: 8px 14px; }
  .team small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .team.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .team.active small { color: #c7d2fe; }
  .team.admin { border-style: dashed; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .stat.static { cursor: default; }
  .stat.active { outline: 2px solid var(--blue); }
  .stat .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

  .serials { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .sgroup { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .sgroup .gl { font-size: 11px; color: var(--muted); min-width: 70px; text-transform: uppercase; letter-spacing: .5px; }
  .chip { min-width: 34px; padding: 4px 8px; border-radius: 7px; font-size: 12px; font-weight: 700; text-align: center;
          border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip.RUNNING, .chip.READY { border-color: rgba(34,197,94,.6); color: var(--green); }
  .chip.BLOCKED { border-color: rgba(239,68,68,.6); color: var(--red); }
  .chip.PAUSED { border-color: rgba(249,115,22,.6); color: var(--orange); }
  .chip.OFFLINE, .chip.LOGGED_OUT, .chip.UNKNOWN, .chip.NODATA { color: #94a3b8; }
  .chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }

  .tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tools input { flex: 1; min-width: 160px; }

  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--gray);
          border-radius: 12px; padding: 12px 14px; }
  .card.RUNNING { border-left-color: var(--green); }
  .card.BLOCKED { border-left-color: var(--red); }
  .card.READY   { border-left-color: var(--blue); }
  .card.PAUSED  { border-left-color: var(--orange); }
  .card.OFFLINE, .card.LOGGED_OUT, .card.UNKNOWN, .card.NODATA { opacity: .85; }
  .row1 { display: flex; align-items: flex-start; gap: 8px; }
  .idline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .idno { font-weight: 800; font-size: 15px; white-space: nowrap; }
  .idno .tm { color: var(--blue); font-weight: 600; }
  .mail { font-weight: 600; font-size: 14px; word-break: break-all; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
  .sub b { color: #cbd5e1; font-weight: 600; }
  .pill { margin-left: auto; white-space: nowrap; font-size: 11px; font-weight: 700; padding: 3px 9px;
          border-radius: 999px; letter-spacing: .5px; }
  .pill.RUNNING { background: rgba(34,197,94,.15); color: var(--green); }
  .pill.BLOCKED { background: rgba(239,68,68,.15); color: var(--red); }
  .pill.READY   { background: rgba(56,189,248,.15); color: var(--blue); }
  .pill.PAUSED  { background: rgba(249,115,22,.15); color: var(--orange); }
  .pill.OFFLINE, .pill.LOGGED_OUT, .pill.UNKNOWN, .pill.NODATA { background: rgba(100,116,139,.2); color: #94a3b8; }
  .big { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 6px; }
  .timer { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rest { margin-top: 8px; }
  .rest-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
  .rest-top b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .rbar { height: 10px; border-radius: 6px; background: var(--panel2); overflow: hidden; margin-top: 4px; border: 1px solid var(--line); }
  .rbar i { display: block; height: 100%; border-radius: 6px; transition: width .5s, background .5s; }
  .rest-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .timer.red { color: var(--red); } .timer.orange { color: var(--orange); font-size: 22px; }
  .soff { color: var(--amber); font-weight: 600; }
  .notice { font-size: 12px; color: var(--muted); margin-top: 4px; } .timer.green { color: var(--green); } .timer.gray { color: var(--muted); font-size: 15px; }
  .bal { text-align: right; }
  .bal b { font-size: 18px; }
  .bal div { font-size: 11px; color: var(--muted); }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12px; margin-top: 6px; }
  .cats span { display: flex; justify-content: space-between; color: var(--muted); }
  .cats span.has b { color: var(--green); }
  .foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .foot a { color: var(--muted); cursor: pointer; }
  .foot a:hover { color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; }

  #login { position: fixed; inset: 0; z-index: 50; background: rgba(4,7,14,.97); display: flex;
           align-items: center; justify-content: center; padding: 16px; }
  #login[hidden] { display: none; }
  #login form { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
                padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; }
  #login h2 { margin: 0 0 6px; font-size: 20px; }
  #login p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  #login input { width: 100%; margin-bottom: 10px; font-size: 16px; padding: 10px 12px; }
  #login button[type=submit] { width: 100%; padding: 10px; font-weight: 600; background: var(--accent); border-color: var(--accent); }
  #loginClose { position: absolute; top: 8px; right: 8px; padding: 2px 9px; background: none; border: none; color: var(--muted); font-size: 18px; }
  #loginErr { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
  #pwPanel { position: fixed; inset: 0; z-index: 40; background: rgba(4,7,14,.9); display: flex;
             align-items: center; justify-content: center; padding: 16px; }
  #pwPanel[hidden] { display: none; }
  #pwPanel .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
                  width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; }
  #pwPanel h2 { margin: 0 0 4px; font-size: 18px; }
  #pwPanel .hint { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .pwrow { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .pwrow .tn { font-weight: 600; word-break: break-word; }
  .pwrow .tn small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .pwrow .tn small.ok { color: var(--green); }
  .pwrow input { min-width: 0; }
  .pwmsg { font-size: 12px; min-height: 16px; margin-top: 6px; }
  .sgroup.head { gap: 8px; }
  .toggle { padding: 3px 10px; font-size: 12px; font-weight: 700; border-radius: 7px; }
  .serials.collapsed .sgroup:not(.head) { display: none; }

  .earn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .earn-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .earn-top .et { font-weight: 700; font-size: 15px; }
  .earn-top input[type=datetime-local] { padding: 5px 8px; color-scheme: dark; }
  #customRange { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #customRange label { font-size: 12px; color: var(--muted); }
  #customRange .dt { display: inline-flex; gap: 6px; align-items: center; }
  #customRange label { min-width: 32px; }
  .etotal { text-align: right; }
  .etotal b { font-size: 22px; color: var(--green); font-variant-numeric: tabular-nums; }
  .etotal div { font-size: 11px; color: var(--muted); }
  .days { display: grid; gap: 4px; margin-top: 10px; }
  .day { display: grid; grid-template-columns: 160px 1fr 70px; gap: 8px; align-items: center; font-size: 12px; }
  .day .bar { height: 10px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
  .day .bar i { display: block; height: 100%; background: var(--green); border-radius: 4px; }
  .day .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .enote { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .dtoggle { margin-top: 10px; font-size: 12px; }
  .dwrap { overflow-x: auto; margin-top: 8px; }
  table.det { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.det th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.det td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.det td.n { text-align: right; white-space: nowrap; }
  table.det td.m { word-break: break-all; min-width: 160px; }
  table.det tr.tot td { font-weight: 700; border-bottom: none; }
  .g { color: var(--green); } .r { color: var(--red); } .mu { color: var(--muted); }
  .earned { font-size: 12px; color: var(--green); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .earned.zero { color: var(--muted); }
  @media (max-width: 480px) { .etotal { text-align: left; width: 100%; } .day { grid-template-columns: 120px 1fr 56px; font-size: 11px; } }
  @media (max-width: 480px) {
    header { padding: 10px; }
    h1 { font-size: 16px; }
    .teams { gap: 6px; margin-top: 8px; }
    .team { padding: 6px 10px; font-size: 13px; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .stat { padding: 6px 8px; }
    .stat .n { font-size: 17px; }
    .stat .l { font-size: 9px; letter-spacing: .3px; }
    .tools input { min-width: 0; flex-basis: 100%; }
  }
  @media (max-width: 480px) { header { position: static; } main { padding: 10px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🗳 BP Vote Monitor</h1>
    <div class="spacer"></div>
    <span class="conn" id="conn"></span>
    <button id="logoutBtn" title="Logout from this browser">🔒 Logout</button>
  </div>
  <div class="teams" id="teams"></div>
  <div id="teamView" hidden>
    <div class="stats" id="stats"></div>
    <div class="serials" id="serials"></div>
    <div class="tools">
      <input id="q" placeholder="Search mail / worker ID…">
      <select id="sort">
        <option value="serial">Sort: ID number</option>
        <option value="status">Sort: status</option>
        <option value="unlock">Sort: unlock soonest</option>
        <option value="balance">Sort: balance</option>
      </select>
      <button id="notifyBtn" title="Alert me when an ID gets unblocked">🔕 Alerts: off</button>
      <button id="pwBtn" hidden title="Set team passwords">🔑 Passwords</button>
    </div>
  </div>
</header>
<main>
  <section class="earn" id="earnPanel" hidden>
    <div class="earn-top">
      <span class="et">💰 Earnings</span>
      <select id="period">
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="7d">Last 7 days</option>
        <option value="month">This month</option>
        <option value="30d">Last 30 days</option>
        <option value="custom">Custom date &amp; time…</option>
      </select>
      <span id="customRange" hidden title="Bangladesh time"><span class="dt"><label for="dFrom">From (BD)</label><input type="datetime-local" id="dFrom"></span><span class="dt"><label for="dTo">To (BD)</label><input type="datetime-local" id="dTo"></span></span>
      <div class="spacer"></div>
      <div class="etotal"><b id="earnTotal">—</b><div id="earnSub"></div></div>
    </div>
    <div class="days" id="earnDays"></div>
    <button class="dtoggle" id="detToggle">▸ Show A–Z details per ID</button>
    <div class="dwrap" id="earnDetails" hidden></div>
    <div class="enote" id="earnNote"></div>
  </section>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Choose a team above.</div>
</main>

<div id="pwPanel" hidden>
  <div class="box">
    <div style="display:flex;align-items:center"><h2>🔑 Team passwords</h2><div class="spacer"></div><button id="pwClose">Close</button></div>
    <p class="hint">Each team sees only its own IDs. ALL ID = admin (sees every team). Passwords are stored only on the server, hashed. Old passwords cannot be shown.</p>
    <div id="pwRows"></div>
    <div class="pwmsg" id="pwMsg"></div>
  </div>
</div>

<div id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <button type="button" id="loginClose" title="Close">×</button>
    <h2>🔒 <span id="loginTeam"></span></h2>
    <p>Enter password to open this team</p>
    <input type="text" name="username" id="loginUser" autocomplete="username" hidden>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Login</button>
    <div id="loginErr"></div>
  </form>
</div>

<script>
(() => {
  const OFFLINE_AFTER_MS = 3 * 60 * 1000;   // no report for 3 min → OFFLINE
  const POLL_MS = 5000;

  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
               del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  // Tokens (not passwords) are remembered per team in this browser
  const tokKey = t => 'bpvm_tok_' + t.toUpperCase();
  // Each team button needs its own login. The admin login opens only ALL ID.
  const tokenFor = t => ls.get(tokKey(t)) || '';

  let teams = [], team = ls.get('bpvm_team') || '', accounts = [], serverSkew = 0;
  let filter = 'ALL', selected = null, notifyOn = ls.get('bpvm_notify') === '1', passwordTeams = [];
  let serialsOpen = ls.get('bpvm_serials') !== '0';
  let earnLoading = false, earnRows = [], earnSince = 0, earnApproxUntil = 0, earnRange = null, earnErr = '', earnBucket = 'hour';
  let detailsOpen = ls.get('bpvm_details') === '1';
  const prevStatus = {};

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const money = c => c == null ? '—' : '$' + (c / 100).toFixed(2);
  const now = () => Date.now() + serverSkew;
  const serialNum = a => { const n = parseFloat(a.serial); return isNaN(n) ? 1e9 : n; };

  function hms(ms) {
    if (ms < 0) ms = 0;
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;
  }
  function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  const stale = a => a.reported && now() - a.lastSeen > OFFLINE_AFTER_MS;   // script (Chrome) not reporting
  function statusOf(a) {
    if (!a.reported) return 'NODATA';
    // The unlock / pause end time comes from the site, so it stays true even when Chrome is closed
    if (a.state === 'BLOCKED' && a.unlockAt) return a.unlockAt <= now() ? 'READY' : 'BLOCKED';
    if (a.state === 'PAUSED' && a.waitUntil && a.waitUntil > now()) return 'PAUSED';
    if (stale(a)) return 'OFFLINE';
    return a.state || 'UNKNOWN';
  }
  const LABEL = { RUNNING: 'RUNNING', BLOCKED: 'BLOCKED', PAUSED: 'PAUSED', READY: 'UNLOCKED', OFFLINE: 'OFFLINE',
                  LOGGED_OUT: 'LOGGED OUT', UNKNOWN: 'UNKNOWN', NODATA: 'NO DATA' };
  const ORDER = { READY: 0, RUNNING: 1, BLOCKED: 2, PAUSED: 3, LOGGED_OUT: 4, UNKNOWN: 5, OFFLINE: 6, NODATA: 7 };
  const isStop = s => s === 'BLOCKED' || s === 'PAUSED';
  const isRun = s => s === 'RUNNING' || s === 'READY';
  const isOff = s => ['OFFLINE', 'LOGGED_OUT', 'UNKNOWN', 'NODATA'].includes(s);
  const idLabel = a => a.unassigned ? 'Not in sheet' : `ID-${a.serial}`;

  /* ── team buttons ─────────────────────────────────────── */
  function renderTeams() {
    const btn = (name, label, count, extra = '') => {
      const unlocked = !!tokenFor(name);
      return `<button class="team ${extra} ${name === team ? 'active' : ''}" data-team="${esc(name)}">
        ${unlocked ? '' : '🔒 '}${esc(label)}${count != null ? `<small>(${count})</small>` : ''}</button>`;
    };
    $('teams').innerHTML = teams.map(t => btn(t.name, t.name, t.count)).join('') + btn('ALL', 'ALL ID', null, 'admin');
  }

  function openTeam(name) {
    team = name; selected = null; filter = 'ALL'; accounts = [];
    ls.set('bpvm_team', team);
    renderTeams(); render();
    earnRows = []; earnRange = null;
    if (!tokenFor(team)) showLogin(); else { poll(); loadEarnings(); }
  }

  /* ── login box ────────────────────────────────────────── */
  function showLogin(err) {
    $('loginTeam').textContent = team === 'ALL' ? 'ALL ID (Admin)' : team;
    $('loginUser').value = 'bp-vote-monitor ' + team;
    $('loginErr').textContent = err || '';
    $('pw').value = '';
    $('login').hidden = false;
    $('pw').focus();
  }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ team, password: $('pw').value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { $('loginErr').textContent = r.status === 401 ? 'Wrong password. Please try again.' : (d.error || 'Error'); $('pw').select(); return; }
      ls.set(tokKey(d.scope), d.token);
      $('login').hidden = true;
      renderTeams(); poll(); loadEarnings();
    } catch (err) { $('loginErr').textContent = 'Server not reachable'; }
  });
  $('loginClose').addEventListener('click', () => {
    $('login').hidden = true;
    if (!tokenFor(team)) { team = ''; ls.del('bpvm_team'); renderTeams(); render(); }
  });
  $('logoutBtn').addEventListener('click', () => {
    try { Object.keys(localStorage).filter(k => k.startsWith('bpvm_tok_')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    team = ''; ls.del('bpvm_team'); accounts = []; selected = null;
    renderTeams(); render();
  });

  /* ── data ─────────────────────────────────────────────── */
  async function loadTeams() {
    try {
      const r = await fetch('/api/teams');
      teams = (await r.json()).teams || [];
    } catch (e) {}
    renderTeams();
  }

  async function poll() {
    if (!team || !tokenFor(team)) return;
    const asked = team;
    try {
      const r = await fetch('/api/accounts?team=' + encodeURIComponent(team), { headers: { 'X-Token': tokenFor(team) } });
      if (asked !== team) return;
      if (r.status === 401) {
        ls.del(tokKey(team));
        accounts = []; renderTeams(); render();
        if (!tokenFor(team)) showLogin();
        return;
      }
      const d = await r.json();
      serverSkew = d.now - Date.now();
      const fresh = d.accounts || [];
      // If only "last seen" times changed, just update those numbers (no page rebuild)
      const sigOf = list => JSON.stringify(list.map(a => ({ ...a, lastSeen: 0 })));
      const onlySeen = fresh.length === accounts.length && sigOf(fresh) === sigOf(accounts);
      accounts = fresh;
      if (d.passwordTeams) passwordTeams = d.passwordTeams;
      $('conn').textContent = d.sheetError ? '⚠ Sheet: ' + d.sheetError : 'updated ' + fmtClock(Date.now()) + ' (BD time)';
      $('conn').className = d.sheetError ? 'conn err' : 'conn';
      if (onlySeen && statusSig() === lastSig) {
        for (const a of accounts) {
          const el = document.querySelector(`[data-key="${CSS.escape(a.key)}"] [data-seen]`);
          if (el) { el.dataset.seen = a.lastSeen; el.textContent = 'seen ' + ago(now() - a.lastSeen); }
        }
        return;
      }
    } catch (e) {
      $('conn').textContent = '⚠ server not reachable';
      $('conn').className = 'conn err';
    }
    render();
  }

  /* ── rendering ────────────────────────────────────────── */
  function renderStats() {
    const c = { ALL: accounts.length, RUNNING: 0, BLOCKED: 0, OFFLINE: 0 };
    let bal = 0, votes = 0;
    for (const a of accounts) {
      const s = statusOf(a);
      if (isRun(s)) c.RUNNING++; else if (isStop(s)) c.BLOCKED++; else c.OFFLINE++;
      bal += a.totalBalanceCents || 0;
      if (s === 'RUNNING') votes += a.totalAvailable || 0;
    }
    const items = [
      ['ALL', c.ALL, 'IDs', ''],
      ['RUNNING', c.RUNNING, 'Running / Unlocked', 'color:var(--green)'],
      ['BLOCKED', c.BLOCKED, 'Blocked / Paused', 'color:var(--red)'],
      ['OFFLINE', c.OFFLINE, 'Offline / No data', 'color:#94a3b8'],
      [null, money(bal), 'Total balance', ''],
      [null, votes, 'Votes available', 'color:var(--blue)'],
    ];
    $('stats').innerHTML = items.map(([f, n, l, st]) =>
      `<div class="stat ${f ? (f === filter ? 'active' : '') : 'static'}" ${f ? `data-f="${f}"` : ''}>
         <div class="n" style="${st}">${esc(n)}</div><div class="l">${l}</div></div>`).join('');
  }

  function renderSerials() {
    const groups = new Map();
    const tIdx = a => { const i = teams.findIndex(t => t.name === a.team); return i < 0 ? 999 : i; };
    for (const a of [...accounts].sort((x, y) => tIdx(x) - tIdx(y) || serialNum(x) - serialNum(y))) {
      const g = team === 'ALL' ? (a.team || 'Not in sheet') : '';
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(a);
    }
    const allChip = `<span class="chip ${selected === null ? 'sel' : ''}" data-sel="">All</span>`;
    const sel = accounts.find(a => a.key === selected);
    let html = `<div class="sgroup head"><button class="toggle" id="serialToggle" title="${serialsOpen ? 'Hide' : 'Show'} ID numbers">${serialsOpen ? '▾' : '▸'} IDs</button>${allChip}` +
      (!serialsOpen && sel ? `<span class="chip ${statusOf(sel)} sel">${esc(team === 'ALL' && sel.team ? sel.team + ' ' : '')}${sel.unassigned ? '?' : esc(sel.serial)}</span>` : '') + `</div>`;
    for (const [g, list] of groups) {
      html += `<div class="sgroup">${g ? `<span class="gl">${esc(g)}</span>` : ''}` +
        list.map(a => `<span class="chip ${statusOf(a)} ${selected === a.key ? 'sel' : ''}" data-sel="${esc(a.key)}"
          title="${esc(a.mail)} · ${LABEL[statusOf(a)]}">${a.unassigned ? '?' : esc(a.serial)}</span>`).join('') + `</div>`;
    }
    $('serials').innerHTML = html;
    $('serials').classList.toggle('collapsed', !serialsOpen);
  }

  /* ── earnings & time-range report ──────────────────────── */
  const HOUR = 3600000, DAY = 86400000;
  // All times on the dashboard are Bangladesh time, whatever the viewer's PC/VPS clock zone is.
  // Bangladesh has no daylight saving, so it is always UTC+6.
  const TZ = 'Asia/Dhaka', TZ_OFF = 6 * HOUR;
  const bdParts = t => { const d = new Date(t + TZ_OFF); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; };
  const dayStart = t => Math.floor((t + TZ_OFF) / DAY) * DAY - TZ_OFF;        // BD midnight
  const fromInput = v => { const [d, tm] = v.split('T'); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = (tm || '0:0').split(':').map(Number);
                           return Date.UTC(y, m - 1, dd, h, mi) - TZ_OFF; };
  const PERIOD_LABEL = { today: 'today', yesterday: 'yesterday',
                         '7d': 'last 7 days', month: 'this month', '30d': 'last 30 days', custom: 'in range' };
  const pad = n => String(n).padStart(2, '0');
  const toInput = t => { const p = bdParts(t); return `${p.y}-${pad(p.m + 1)}-${pad(p.d)}T${pad(p.h)}:${pad(p.mi)}`; };
  const fmtTime = t => new Date(t).toLocaleTimeString('en-US', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  const fmtDT = t => new Date(t).toLocaleString('en-US', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const fmtClock = t => new Date(t).toLocaleTimeString('en-US', { timeZone: TZ });
  const sameDay = (a, b) => dayStart(a) === dayStart(b);
  const fmtWhen = t => sameDay(t, now()) ? fmtTime(t) : fmtDT(t);              // time today, date+time otherwise
  const fmtRange = (a, b) => sameDay(a, b - 1) ? `${fmtDT(a)} → ${fmtTime(b)}` : `${fmtDT(a)} → ${fmtDT(b)}`;
  function dur(ms) {
    const m = Math.round(ms / 60000);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    return h < 24 ? `${h}h ${pad(m % 60)}m` : `${Math.floor(h / 24)}d ${h % 24}h`;
  }

  function periodRange() {
    const p = $('period').value, t = now(), today = dayStart(t), bp = bdParts(t);
    if (p === 'today') return [today, t + 60000];
    if (p === 'yesterday') return [today - DAY, today];
    if (p === '7d') return [today - 6 * DAY, t + 60000];
    if (p === 'month') return [Date.UTC(bp.y, bp.m, 1) - TZ_OFF, t + 60000];
    if (p === '30d') return [today - 29 * DAY, t + 60000];
    const f = $('dFrom').value, e = $('dTo').value;
    if (!f || !e) return null;
    const from = fromInput(f), to = fromInput(e);   // the boxes are in Bangladesh time
    return to > from ? [from, to] : null;
  }

  async function loadEarnings() {
    if (!team || !tokenFor(team)) return;
    const range = periodRange();
    earnRange = range;
    if (!range) { earnRows = []; earnErr = 'Choose a start and an end time (end after start)'; renderEarnings(); return; }
    const newBucket = range[1] - range[0] <= 2 * DAY ? 'hour' : 'day';
    const asked = team;
    if (!earnRows.length || newBucket !== earnBucket) { earnLoading = true; renderEarnings(); }
    earnBucket = newBucket;
    try {
      const q = `team=${encodeURIComponent(team)}&from=${range[0]}&to=${range[1]}&tz=${-TZ_OFF / 60000}&bucket=${earnBucket}`;
      const r = await fetch('/api/earnings?' + q, { headers: { 'X-Token': tokenFor(team) } });
      if (asked !== team || earnRange !== range) return;
      if (!r.ok) { earnErr = 'Could not load earnings'; earnRows = []; }
      else {
        const d = await r.json();
        const same = !earnLoading && !earnErr && JSON.stringify(d.rows || []) === JSON.stringify(earnRows);
        earnRows = d.rows || [];
        if (same) return; earnSince = d.trackingSince || 0; earnApproxUntil = d.approxUntil || 0; earnErr = '';
      }
    } catch (e) { earnErr = 'Server not reachable'; }
    earnLoading = false;
    render();
  }

  function earnedFor(key) { const r = earnRows.find(x => x.key === key); return r ? r.earned : 0; }
  function earnedLine(a) {
    if (!earnRange || earnErr) return '';
    const c = earnedFor(a.key);
    return `<div class="earned ${c ? '' : 'zero'}">+${money(c)} ${PERIOD_LABEL[$('period').value]}</div>`;
  }

  function renderEarnings() {
    const custom = $('period').value === 'custom';
    $('customRange').hidden = !custom;
    if (earnLoading && !earnErr) { $('earnTotal').textContent = '…'; $('earnSub').textContent = 'Loading…'; return; }
    if (earnErr || !earnRange) {
      $('earnTotal').textContent = '—'; $('earnSub').textContent = earnErr; $('earnDays').innerHTML = '';
      $('earnDetails').innerHTML = ''; return;
    }
    const [from, to] = earnRange, end = Math.min(to, now());
    const rows = selected ? earnRows.filter(r => r.key === selected) : earnRows;
    const sel = selected && accounts.find(a => a.key === selected);
    let total = 0, collected = 0, active = 0;
    const byBucket = new Map();
    for (const r of rows) {
      total += r.earned; collected += r.collected;
      if (r.earned > 0) active++;
      for (const [b, c] of Object.entries(r.buckets || {})) byBucket.set(Number(b), (byBucket.get(Number(b)) || 0) + c);
    }
    $('earnTotal').textContent = money(total);
    $('earnSub').textContent = (sel ? `${idLabel(sel)} · ${sel.mail}` : `${active} of ${rows.length} IDs earned`) +
      ` · ${fmtRange(from, end)}` + (collected ? ` · collected ${money(collected)}` : '');

    // Bars: one per hour (ranges up to 2 days) or one per day
    let html = '';
    const size = earnBucket === 'day' ? DAY : HOUR;
    const off = TZ_OFF;
    const bStart = t => Math.floor((t + off) / size) * size - off;
    if (end - from > (size === HOUR ? HOUR : 26 * HOUR)) {
      const list = [];
      for (let b = bStart(from); b < end; b += size) list.push(b);
      const max = Math.max(1, ...list.map(b => byBucket.get(b) || 0));
      html = list.map(b => {
        const c = byBucket.get(b) || 0, a = Math.max(b, from), z = Math.min(b + size, end);
        const label = size === DAY
          ? new Date(b).toLocaleDateString('en-US', { timeZone: TZ, day: 'numeric', month: 'short', weekday: 'short' })
          : `${fmtTime(a)}–${fmtTime(z)}`;
        return `<div class="day"><span>${label}</span><span class="bar"><i style="width:${(c / max * 100).toFixed(1)}%"></i></span><span class="amt">${money(c)}</span></div>`;
      }).join('');
    }
    $('earnDays').innerHTML = html;

    // A–Z table per ID
    $('detToggle').textContent = (detailsOpen ? '▾ Hide' : '▸ Show') + ' A–Z details per ID';
    $('earnDetails').hidden = !detailsOpen;
    if (detailsOpen) {
      const span = Math.max(1, end - from);
      const byKey = new Map(accounts.map(a => [a.key, a]));
      const tIdx = a => { const i = teams.findIndex(t => t.name === a.team); return i < 0 ? 999 : i; };
      const list = rows.map(r => ({ r, a: byKey.get(r.key) || { key: r.key, mail: r.mail } }))
        .sort((x, y) => tIdx(x.a) - tIdx(y.a) || serialNum(x.a) - serialNum(y.a));
      let tb = 0, tc = 0, tbl = 0;
      const body = list.map(({ r, a }) => {
        tb += r.earned; tc += r.collected; tbl += r.blockedMs;
        const blocks = r.blocks.map(b => `${fmtDT(b.at)} → ${b.endedAt ? fmtTime(b.endedAt) : (b.unlockAt ? fmtTime(b.unlockAt) + ' (expected)' : 'still blocked')}`).join('<br>');
        const online = r.onlineMs ? Math.min(100, Math.round(r.onlineMs / span * 100)) + '%' : (r.firstSeen ? '1 check' : '—');
        const s = statusOf(a);
        return `<tr>
          <td>${team === 'ALL' && a.team ? esc(a.team) + ' · ' : ''}${esc(idLabel(a))}</td>
          <td class="m">${esc(r.mail)}</td>
          <td class="n ${r.earned ? 'g' : 'mu'}">${money(r.earned)}</td>
          <td class="n ${r.collected ? '' : 'mu'}">${money(r.collected)}</td>
          <td class="n ${r.blockedMs ? 'r' : 'mu'}">${r.blockedMs ? dur(r.blockedMs) : '—'}</td>
          <td class="${blocks ? '' : 'mu'}" style="white-space:nowrap">${blocks || '—'}</td>
          <td class="n">${online}</td>
          <td class="mu" style="white-space:nowrap">${r.firstSeen ? fmtTime(r.firstSeen) + ' – ' + fmtTime(r.lastSeen) : '—'}</td>
          <td style="white-space:nowrap">${LABEL[s]}</td></tr>`;
      }).join('');
      const keepScroll = $('earnDetails').scrollLeft;
      $('earnDetails').innerHTML = `<table class="det"><thead><tr>
        <th>ID</th><th>Mail</th><th>Earned</th><th>Collected</th><th>Blocked</th><th>Blocked at → unlock</th>
        <th>Script online</th><th>Reports</th><th>Now</th></tr></thead><tbody>${body}
        <tr class="tot"><td colspan="2">Total (${list.length} IDs)</td><td class="n g">${money(tb)}</td><td class="n">${money(tc)}</td>
        <td class="n">${tbl ? dur(tbl) : '—'}</td><td colspan="4"></td></tr></tbody></table>`;
      $('earnDetails').scrollLeft = keepScroll;
    }

    // Honest notes about what the numbers are based on
    const notes = [];
    notes.push('Real data only: money is counted when the script sees the balance go up (it checks every 60 seconds). Collected/payout money is not counted as earning.');
    if (earnSince && from < earnSince) notes.push(`No data before ${fmtDT(earnSince)} (tracking started then).`);
    if (earnApproxUntil && from < earnApproxUntil) notes.push(`Before ${fmtDT(earnApproxUntil)} the old version saved earnings per hour, so those times are rounded to the hour.`);
    if (rows.some(r => r.earned && r.onlineMs < (end - from) * 0.95)) notes.push('If "Script online" is below 100%, votes made while the script was off are counted when it comes back.');
    $('earnNote').innerHTML = notes.map(esc).join('<br>');
  }

  function cardHtml(a) {
    const s = statusOf(a);
    let timer;
    if (s === 'BLOCKED') timer = a.unlockAt ? `<div class="timer red" data-unlock="${a.unlockAt}">${hms(a.unlockAt - now())}</div>` : `<div class="timer red">Blocked</div>`;
    else if (s === 'PAUSED') timer = `<div><div class="timer orange">Paused${a.waitText ? ' · ' + esc(a.waitText) : ''}</div>` +
      (a.noticeText ? `<div class="notice">${esc(a.noticeText)} ${esc(a.waitText || '')}</div>` : '') + `</div>`;
    else if (s === 'READY') timer = `<div class="timer green">Unlocked ✓</div>`;
    else if (s === 'RUNNING') timer = `<div class="timer green">${a.totalAvailable || 0} <span style="font-size:13px;color:var(--muted)">votes avail.</span></div>`;
    else if (s === 'OFFLINE') timer = `<div class="timer gray">No report ${ago(now() - a.lastSeen)}</div>`;
    else if (s === 'NODATA') timer = `<div class="timer gray">Script not reporting yet</div>`;
    else timer = `<div><div class="timer gray">${LABEL[s]}</div>${a.noticeText ? `<div class="notice">Site says: ${esc(a.noticeText)} ${esc(a.waitText || '')}</div>` : ''}</div>`;

    const cats = (a.categories || []).map(c =>
      `<span class="${c.count > 0 ? 'has' : ''}">${esc(c.name)} <b>${c.count}</b></span>`).join('');
    // Site gives only whole days (e.g. "9 days"), so the end date is approximate
    const roughWait = a.waitText && !/hour|min|sec|:/i.test(a.waitText);
    const footL = s === 'PAUSED' && a.waitUntil
      ? `Back ${roughWait ? '≈ ' + new Date(a.waitUntil - serverSkew).toLocaleDateString('en-US', { timeZone: TZ, day: 'numeric', month: 'short' }) : 'at ' + fmtWhen(a.waitUntil - serverSkew)}`
      : s === 'BLOCKED' && a.unlockAt
      ? `Unlocks at ${fmtWhen(a.unlockAt - serverSkew)}`
      : s === 'READY' && a.unlockAt
      ? `Unlocked at ${fmtWhen(a.unlockAt - serverSkew)}`
      : (a.rateLimitText ? `Limit ${esc(a.rateLimitText)}` : '');
    const footR = a.reported ? `<span data-seen="${a.lastSeen}">seen ${ago(now() - a.lastSeen)}</span>` : '';
    const del = team === 'ALL' && a.accountId ? ` · <a data-del="${esc(a.accountId)}" title="Remove this report">✕</a>` : '';

    return `<div class="card ${s}" data-key="${esc(a.key)}">
      <div class="row1">
        <div style="min-width:0">
          <div class="idline">
            <span class="idno">${team === 'ALL' && a.team ? `<span class="tm">${esc(a.team)}</span> · ` : ''}${esc(idLabel(a))}</span>
            <span class="mail">${esc(a.mail)}</span>
          </div>
          <div class="sub">
            ${a.workerId ? `<span>Worker ID <b>${esc(a.workerId)}</b></span>` : ''}
            ${a.bpYear ? `<span>BP Year <b>${esc(a.bpYear)}</b></span>` : ''}
            ${stale(a) && s !== 'OFFLINE' ? `<span class="soff" title="Chrome/script is not reporting. Times come from the last report.">● script off</span>` : ''}
          </div>
        </div>
        <span class="pill ${s}">${LABEL[s]}</span>
      </div>
      <div class="big">${timer}
        <div class="bal"><b>${money(a.totalBalanceCents)}</b><div>balance</div>${earnedLine(a)}</div></div>
      ${restHtml(a, s)}
      ${cats && s !== 'BLOCKED' ? `<div class="cats">${cats}</div>` : ''}
      <div class="foot"><span>${footL || '&nbsp;'}</span><span>${footR}${del}</span></div>
    </div>`;
  }

  function render() {
    const unlocked = team && tokenFor(team);
    $('teamView').hidden = !unlocked;
    $('pwBtn').hidden = team !== 'ALL';
    $('earnPanel').hidden = !unlocked;
    if (!unlocked) {
      $('grid').innerHTML = '';
      $('empty').hidden = false;
      $('empty').textContent = team ? 'Login to see this team.' : 'Choose a team above.';
      return;
    }
    renderStats();
    renderSerials();
    renderEarnings();
    const q = $('q').value.trim().toLowerCase();
    const sort = $('sort').value;
    let list = accounts.filter(a => {
      if (selected !== null) return a.key === selected;
      const s = statusOf(a);
      if (filter === 'RUNNING' && !isRun(s)) return false;
      if (filter === 'BLOCKED' && !isStop(s)) return false;
      if (filter === 'OFFLINE' && !isOff(s)) return false;
      if (q && !`${a.mail} ${a.workerId} ${a.team} id-${a.serial} ${a.bpYear}`.toLowerCase().includes(q)) return false;
      return true;
    });
    const unl = a => statusOf(a) === 'BLOCKED' ? a.unlockAt : 0;
    const tIdx = a => { const i = teams.findIndex(t => t.name === a.team); return i < 0 ? 999 : i; };
    const bySerial = (a, b) => (team === 'ALL' ? tIdx(a) - tIdx(b) : 0) || serialNum(a) - serialNum(b);
    list.sort((a, b) => {
      if (sort === 'balance') return (b.totalBalanceCents || 0) - (a.totalBalanceCents || 0);
      if (sort === 'unlock') return unl(a) - unl(b) || bySerial(a, b);
      if (sort === 'status') return ORDER[statusOf(a)] - ORDER[statusOf(b)] || unl(a) - unl(b) || bySerial(a, b);
      return bySerial(a, b);
    });
    $('empty').hidden = list.length > 0;
    $('empty').textContent = accounts.length ? 'No IDs match.' : 'No IDs for this team in the sheet.';
    $('grid').innerHTML = list.map(cardHtml).join('');
    lastSig = statusSig();
  }

  // Every second: only update the countdowns and "seen … ago" text.
  // The whole page is rebuilt only when a status changes (e.g. blocked → unlocked).
  /* ── Rest time: 12 hours counted from the moment the ID got unlocked ──
     0–3 h red, 3–8 h yellow, 8–12 h green; full green bar when 12 h are done. */
  const REST_MS = 12 * HOUR;
  const restStart = (a, s) =>
    s === 'READY' ? a.unlockAt :
    (['RUNNING', 'OFFLINE', 'UNKNOWN', 'LOGGED_OUT'].includes(s) && a.state !== 'BLOCKED') ? a.lastUnlockAt : null;
  function restView(start) {
    const done = Math.max(0, now() - start), left = REST_MS - done, h = done / HOUR;
    const color = left <= 0 ? 'var(--green)' : h < 3 ? 'var(--red)' : h < 8 ? '#eab308' : 'var(--green)';
    return {
      pct: Math.min(100, done / REST_MS * 100).toFixed(2), color,
      big: left > 0 ? hms(left) : 'Rest complete ✓',
      sub: left > 0 ? `Rested ${dur(done)} of 12h · ready at ${fmtWhen(start + REST_MS - serverSkew)}` : `Rested ${dur(done)} (12h done)`,
    };
  }
  function restHtml(a, s) {
    const start = restStart(a, s);
    if (!start) return '';
    const v = restView(start);
    return `<div class="rest" data-rest="${start}">
      <div class="rest-top"><span>Rest time</span><b class="rv" style="color:${v.color}">${v.big}</b></div>
      <div class="rbar"><i style="width:${v.pct}%;background:${v.color}"></i></div>
      <div class="rest-sub">${v.sub}</div></div>`;
  }

  let lastSig = '';
  const statusSig = () => team + '|' + accounts.map(a => statusOf(a) + (stale(a) ? '*' : '')).join(',');
  function tick() {
    if (!team || !tokenFor(team)) return;
    checkTransitions();
    if (statusSig() !== lastSig) { render(); return; }
    for (const el of document.querySelectorAll('[data-unlock]')) el.textContent = hms(Number(el.dataset.unlock) - now());
    for (const el of document.querySelectorAll('[data-rest]')) {
      const v = restView(Number(el.dataset.rest)), big = el.querySelector('.rv'), bar = el.querySelector('.rbar i');
      big.textContent = v.big; big.style.color = v.color;
      bar.style.width = v.pct + '%'; bar.style.background = v.color;
      el.querySelector('.rest-sub').textContent = v.sub;
    }
    for (const el of document.querySelectorAll('[data-seen]')) el.textContent = 'seen ' + ago(now() - Number(el.dataset.seen));
  }

  /* ── alerts when an ID becomes unblocked ──────────────── */
  let audioCtx = null;
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = .15;
      o.start(); o.stop(audioCtx.currentTime + .25);
    } catch (e) {}
  }
  function checkTransitions() {
    for (const a of accounts) {
      const s = statusOf(a), p = prevStatus[a.key];
      if (notifyOn && p === 'BLOCKED' && isRun(s)) {
        beep();
        try { if (Notification.permission === 'granted') new Notification('ID unlocked', { body: `${a.team} ${idLabel(a)} · ${a.mail}` }); } catch (e) {}
      }
      prevStatus[a.key] = s;
    }
  }

  /* ── events ───────────────────────────────────────────── */
  $('teams').addEventListener('click', e => {
    const b = e.target.closest('[data-team]'); if (b) openTeam(b.dataset.team);
  });
  $('stats').addEventListener('click', e => {
    const el = e.target.closest('[data-f]'); if (!el) return;
    filter = el.dataset.f === filter ? 'ALL' : el.dataset.f; selected = null; render();
  });
  $('serials').addEventListener('click', e => {
    if (e.target.closest('#serialToggle')) {
      serialsOpen = !serialsOpen; ls.set('bpvm_serials', serialsOpen ? '1' : '0'); render(); return;
    }
    const el = e.target.closest('[data-sel]'); if (!el) return;
    selected = el.dataset.sel === '' || el.dataset.sel === selected ? null : el.dataset.sel;
    render();
  });
  $('grid').addEventListener('click', async e => {
    const del = e.target.closest('[data-del]'); if (!del) return;
    if (!confirm('Remove this report? (It comes back if the script reports again.)')) return;
    await fetch('/api/accounts/' + encodeURIComponent(del.dataset.del), { method: 'DELETE', headers: { 'X-Token': tokenFor('ALL') } }).catch(() => {});
    poll();
  });
  $('q').addEventListener('input', () => { selected = null; render(); });
  $('sort').value = ls.get('bpvm_sort') || 'serial';
  $('sort').addEventListener('change', () => { ls.set('bpvm_sort', $('sort').value); render(); });

  /* ── admin: team passwords ────────────────────────────── */
  function renderPwRows() {
    const has = n => passwordTeams.some(k => k.toUpperCase() === n.toUpperCase());
    const rows = [...teams.map(t => t.name), 'ALL'];
    $('pwRows').innerHTML = rows.map(n => `<form class="pwrow" data-pwteam="${esc(n)}">
        <div class="tn">${n === 'ALL' ? 'ALL ID' : esc(n)}<small class="${has(n) ? 'ok' : ''}">${has(n) ? 'password set ✓' : 'no password yet'}</small></div>
        <input type="password" placeholder="New password" autocomplete="new-password" minlength="6" required>
        <button type="submit">Save</button></form>`).join('');
  }
  $('pwBtn').addEventListener('click', () => { $('pwMsg').textContent = ''; renderPwRows(); $('pwPanel').hidden = false; });
  $('pwClose').addEventListener('click', () => { $('pwPanel').hidden = true; });
  $('pwRows').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target.closest('[data-pwteam]'), n = f.dataset.pwteam, inp = f.querySelector('input');
    try {
      const r = await fetch('/api/admin/password', { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Token': tokenFor('ALL') },
        body: JSON.stringify({ team: n, password: inp.value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { $('pwMsg').style.color = 'var(--red)'; $('pwMsg').textContent = d.error || 'Error'; return; }
      if (d.token) ls.set(tokKey('ALL'), d.token);
      if (!passwordTeams.some(k => k.toUpperCase() === n.toUpperCase())) passwordTeams.push(n);
      renderPwRows();
      $('pwMsg').style.color = 'var(--green)';
      $('pwMsg').textContent = `Saved password for ${n === 'ALL' ? 'ALL ID' : n}.`;
    } catch (err) { $('pwMsg').style.color = 'var(--red)'; $('pwMsg').textContent = 'Server not reachable'; }
  });

  function paintNotify() { $('notifyBtn').textContent = notifyOn ? '🔔 Alerts: on' : '🔕 Alerts: off'; }
  $('notifyBtn').addEventListener('click', async () => {
    notifyOn = !notifyOn; ls.set('bpvm_notify', notifyOn ? '1' : '0'); paintNotify();
    if (notifyOn) { beep(); try { if (Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {} }
  });
  paintNotify();

  loadTeams().then(() => { if (team) openTeam(team); else render(); });
  setInterval(loadTeams, 60000);
  setInterval(poll, POLL_MS);
  setInterval(loadEarnings, 10000);
  const savedPeriod = ls.get('bpvm_period');
  $('period').value = [...$('period').options].some(o => o.value === savedPeriod) ? savedPeriod : 'today';
  const setCustom = (a, b) => { $('dFrom').value = toInput(a); $('dTo').value = toInput(b); };
  if (!$('dFrom').value) setCustom(dayStart(now()), now());
  const reloadEarnings = () => { earnRows = []; loadEarnings(); };
  $('period').addEventListener('change', () => { ls.set('bpvm_period', $('period').value); reloadEarnings(); });
  $('dFrom').addEventListener('change', reloadEarnings);
  $('detToggle').addEventListener('click', () => { detailsOpen = !detailsOpen; ls.set('bpvm_details', detailsOpen ? '1' : '0'); renderEarnings(); });
  $('dTo').addEventListener('change', reloadEarnings);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
